<!DOCTYPE html>
<html>
<head>
    <title>Game Caro Siêu Tốc</title>
    <style>
        body { text-align: center; font-family: sans-serif; background: #2c3e50; color: white; padding-top: 30px; }
        .score-board { font-size: 24px; margin-bottom: 20px; font-weight: bold; }
        .board { display: grid; grid-template-columns: repeat(3, 100px); gap: 10px; justify-content: center; margin-top: 10px; }
        .cell { width: 100px; height: 100px; background: #34495e; font-size: 50px; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
        .cell:hover { background: #3d566e; }
        button { margin-top: 20px; padding: 10px 20px; font-size: 18px; cursor: pointer; background: #27ae60; border: none; color: white; border-radius: 5px; }
        button:hover { background: #2ecc71; }
        footer { margin-top: 40px; color: #bdc3c7; font-size: 14px; }
    </style>
</head>
<body>
    <h1>Game Caro</h1>
    
    <div class="score-board">
        X: <span id="scoreX">0</span> | O: <span id="scoreO">0</span>
    </div>

    <div class="board" id="board">
        <div class="cell" onclick="clickCell(0)"></div>
        <div class="cell" onclick="clickCell(1)"></div>
        <div class="cell" onclick="clickCell(2)"></div>
        <div class="cell" onclick="clickCell(3)"></div>
        <div class="cell" onclick="clickCell(4)"></div>
        <div class="cell" onclick="clickCell(5)"></div>
        <div class="cell" onclick="clickCell(6)"></div>
        <div class="cell" onclick="clickCell(7)"></div>
        <div class="cell" onclick="clickCell(8)"></div>
    </div>
    
    <button onclick="resetGame()">Chơi lại</button>

    <footer>
        Made by Huynh Hoang Long 7a1
    </footer>

    <script>
        let turn = 'X';
        let scoreX = 0;
        let scoreO = 0;
        const cells = document.getElementsByClassName('cell');

        function clickCell(index) {
            if (!cells[index].innerText) {
                cells[index].innerText = turn;
                if (checkWinner()) {
                    if (turn === 'X') scoreX++; else scoreO++;
                    document.getElementById('score' + turn).innerText = turn === 'X' ? scoreX : scoreO;
                    setTimeout(() => alert("Người thắng cuộc là: " + turn), 10);
                } else {
                    turn = turn === 'X' ? 'O' : 'X';
                }
            }
        }

        function checkWinner() {
            const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (let line of lines) {
                const [a,b,c] = line;
                if (cells[a].innerText && cells[a].innerText === cells[b].innerText && cells[a].innerText === cells[c].innerText) return true;
            }
            return false;
        }

        function resetGame() {
            for (let cell of cells) cell.innerText = '';
            turn = 'X';
        }
    </script>
</body>
</html>
