<!DOCTYPE html>
<html>
<head>
    <title>Chess Master - Long 7A1</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body style="text-align: center; background: #2c3e50; color: white;">
    <h1>Chess vs Stockfish (Đang load engine...)</h1>
    <div id="myBoard" style="width: 400px; margin: 20px auto;"></div>
    <div id="status"></div>

    <script>
        var board = null;
        var game = new Chess();

        // Khởi tạo bàn cờ
        function onDragStart (source, piece) {
            if (game.game_over()) return false;
            if (piece.search(/^b/) !== -1) return false; // Chỉ cho cầm quân Trắng (w)
        }

        function onDrop (source, target) {
            var move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';
            
            // AI đi sau 250ms
            window.setTimeout(makeRandomMove, 250);
        }

        function makeRandomMove () {
            var possibleMoves = game.moves();
            if (possibleMoves.length === 0) return;
            var randomIdx = Math.floor(Math.random() * possibleMoves.length);
            game.move(possibleMoves[randomIdx]);
            board.position(game.fen());
        }

        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: function () { board.position(game.fen()) }
        };
        board = Chessboard('myBoard', config);
    </script>
</body>
</html>
