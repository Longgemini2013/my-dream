<!DOCTYPE html>
<html>
<head>
    <title>Game Clicker của tôi</title>
    <style>
        body { text-align: center; font-family: Arial; background-color: #1a1a1a; color: red; padding-top: 100px; }
        #counter { font-size: 80px; margin-bottom: 20px; color: #f1c40f; }
        button { padding: 15px 30px; font-size: 20px; cursor: pointer; background: #e74c3c; border: none; color: white; border-radius: 10px; }
        button:active { transform: scale(0.95); } /* Hiệu ứng nhấn nút */
    </style>button:hover {
    background: #c0392b; /* Đổi màu khi di chuột vào */
    transform: scale(1.1); /* Phóng to nhẹ khi di chuột vào */
    transition: 0.2s;
}
</head>
<body>

    <div id="counter">0</div>
    <button onclick="tangSo()">Bấm để tăng điểm!</button>

    <script>
        let diem = 0;
        function tangSo() {
            diem = diem + 1;
            document.getElementById("counter").innerText = diem;
        }
    </script>
</body>
</html>
