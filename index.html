<!DOCTYPE html>
<html>
<head>
    <title>Mini CodeCombat - Long</title>
    <style>
        #grid { display: grid; grid-template-columns: repeat(5, 50px); gap: 5px; margin-bottom: 20px; }
        .cell { width: 50px; height: 50px; background: #eee; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; }
        .hero { background: #e74c3c; color: white; border-radius: 50%; }
        .target { background: #27ae60; }
        textarea { width: 300px; height: 100px; display: block; margin-bottom: 10px; font-family: monospace; }
    </style>
</head>
<body>
    <h1>CodeCombat: Mê cung Lập Trình</h1>
    <div id="grid"></div>
    <textarea id="code" placeholder="Ví dụ: moveRight(); moveDown();"></textarea>
    <button onclick="runCode()">Chạy Code</button>

    <script>
        let heroPos = {x: 0, y: 0};
        const targetPos = {x: 4, y: 4};

        function render() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            for(let y=0; y<5; y++) {
                for(let x=0; x<5; x++) {
                    let cell = document.createElement('div');
                    cell.className = 'cell';
                    if(x === heroPos.x && y === heroPos.y) cell.classList.add('hero'), cell.innerText = '😎';
                    if(x === targetPos.x && y === targetPos.y) cell.classList.add('target');
                    grid.appendChild(cell);
                }
            }
        }

        // Các hàm để bạn gọi trong textarea
        function moveRight() { if(heroPos.x < 4) heroPos.x++; render(); }
        function moveDown() { if(heroPos.y < 4) heroPos.y++; render(); }
        function moveUp() { if(heroPos.y > 0) heroPos.y--; render(); }
        function moveLeft() { if(heroPos.x > 0) heroPos.x--; render(); }

        function runCode() {
            let commands = document.getElementById('code').value;
            try {
                eval(commands); // Chạy những gì bạn gõ vào
                if(heroPos.x === targetPos.x && heroPos.y === targetPos.y) alert("Chiến thắng!");
            } catch(e) { alert("Code lỗi rồi: " + e.message); }
        }

        render();
    </script>
</body>
</html>
