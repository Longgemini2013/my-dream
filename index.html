<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Ultimate Typing Race</title>
    <style>
        :root { --bg: #1a1a1a; --text: #ecf0f1; --accent: #f1c40f; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        h1 { margin-bottom: 20px; }
        
        .controls { background: #2c3e50; padding: 20px; border-radius: 10px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; }
        
        .track-container { width: 90%; max-width: 800px; background: #333; padding: 10px; border-radius: 10px; margin-bottom: 20px; }
        .track { width: 100%; height: 60px; border-bottom: 2px dashed #555; position: relative; }
        #car-player, #car-ai { position: absolute; left: 0; bottom: 5px; font-size: 30px; transition: left 0.3s ease-out; }
        #ai-speech { position: absolute; left: 10%; top: -35px; background: white; color: black; padding: 5px 10px; border-radius: 10px; display: none; font-size: 14px; font-weight: bold; }

        #prompt-container { background: #2c3e50; padding: 20px; border-radius: 10px; border: 2px solid var(--accent); margin-bottom: 20px; width: 90%; max-width: 800px; text-align: center; }
        #target-text { font-size: 24px; font-family: 'Courier New', monospace; letter-spacing: 1px; }
        .correct { color: #2ecc71; }
        .incorrect { color: #e74c3c; text-decoration: underline; }

        input { font-size: 20px; padding: 10px; width: 80%; max-width: 600px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 5px; background: var(--accent); color: black; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Đua Xe Gõ Phím: <span id="player-display">Bạn</span> vs AI</h1>
    
    <div class="controls">
        Tên bạn: <input type="text" id="p1-input" value="Bạn" style="width: 100px;">
        <button onclick="startGame('easy')">Easy</button>
        <button onclick="startGame('medium')">Medium</button>
        <button onclick="startGame('hard')">Hard</button>
    </div>
    
    <div class="track-container">
        <div class="track"><div id="car-player">🏎️</div></div>
        <div class="track">
            <div id="ai-speech">He he!</div>
            <div id="car-ai">🤖</div>
        </div>
    </div>

    <div id="prompt-container">
        <div id="target-text">Chọn độ khó để bắt đầu đua...</div>
    </div>

    <input type="text" id="input-field" placeholder="Gõ câu phía trên vào đây..." disabled>

    <script>
        const inputField = document.getElementById('input-field');
        const playerCar = document.getElementById('car-player');
        const aiCar = document.getElementById('car-ai');
        const aiSpeech = document.getElementById('ai-speech');
        const targetDisplay = document.getElementById('target-text');
        
        const sentences = [
            "Lập trình là nghệ thuật biến ý tưởng thành sự thật.",
            "Muốn thắng AI thì tay phải nhanh hơn não.",
            "Hiếu ơi, gõ chậm thế, tập thêm đi cưng!",
            "Code không chạy là lỗi tại máy, không phải tại tao.",
            "Thao tác là sức mạnh, gõ phím là nghệ thuật.",
            "Đừng nhìn sang màn hình của tao, tập trung đi!"
        ];

        let aiInterval, aiPos, gameActive = false, currentTarget = "";
        const taunts = ["Gõ nhanh tí đi!", "Tao là AI, mày tuổi gì?", "Gà thế!", "Đang lag hay tại mày chậm?", "Về đích trước đây!"];

        function showTaunt() {
            aiSpeech.innerText = taunts[Math.floor(Math.random() * taunts.length)];
            aiSpeech.style.display = 'block';
            setTimeout(() => { aiSpeech.style.display = 'none'; }, 2000);
        }

        function startGame(difficulty) {
            document.getElementById('player-display').innerText = document.getElementById('p1-input').value;
            currentTarget = sentences[Math.floor(Math.random() * sentences.length)];
            
            // Render text with spans for coloring
            targetDisplay.innerHTML = currentTarget.split('').map(char => `<span>${char}</span>`).join('');
            
            gameActive = true;
            aiPos = 0;
            playerCar.style.left = '0%';
            aiCar.style.left = '0%';
            inputField.value = '';
            inputField.disabled = false;
            inputField.focus();
            clearInterval(aiInterval);

            let speed = (difficulty === 'easy') ? 1.0 : (difficulty === 'medium') ? 2.0 : 3.5;
            aiInterval = setInterval(() => {
                if (!gameActive) return;
                aiPos += Math.random() * speed;
                aiCar.style.left = aiPos + '%';
                if (Math.random() > 0.9) showTaunt();
                if (aiPos >= 90) endGame("AI đã về đích. Bạn thua rồi!");
            }, 300);
        }

        inputField.addEventListener('input', () => {
            if (!gameActive) return;
            const inputVal = inputField.value;
            const spans = targetDisplay.querySelectorAll('span');
            
            // Check progress & color coding
            spans.forEach((span, index) => {
                const char = inputVal[index];
                if (char == null) {
                    span.className = '';
                } else if (char === span.innerText) {
                    span.className = 'correct';
                } else {
                    span.className = 'incorrect';
                }
            });

            // Update car
            playerCar.style.left = (inputVal.length / currentTarget.length) * 90 + '%';

            // Win condition
            if (inputVal === currentTarget) endGame("Chúc mừng! Bạn đã thắng AI!");
        });

        function endGame(msg) {
            gameActive = false;
            clearInterval(aiInterval);
            inputField.disabled = true;
            setTimeout(() => alert(msg), 100);
        }
    </script>
</body>
</html>
