<!DOCTYPE html>
<html>
<head>
    <title>Game Caro Siêu Tốc</title>
    <style>
        body { text-align: center; font-family: sans-serif; background: #2c3e50; color: white; padding-top: 50px; }
        .board { display: grid; grid-template-columns: repeat(3, 100px); gap: 10px; justify-content: center; margin-top: 20px; }
        .cell { width: 100px; height: 100px; background: #34495e; font-size: 50px; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
        .cell:hover { background: #3d566e; }
        h1 { margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Game Caro</h1>
    <div class="board" id="board">
        <div class="cell" onclick="clickCell(0)"></div>
        <div class="cell" onclick="clickCell(1)"></div>
        <div class="cell" onclick="clickCell(2)"></div>
        <div class="cell" onclick="clickCell(3)"></div>
        <div class="cell" onclick="clickCell(4)"></div>
        <div class="cell" onclick="clickCell(5)"></div>
        <div class="cell" onclick="clickCell(6)"></div>
        <div class="cell" onclick="clickCell(7)"></div>
        <div class="cell" onclick="clickCell(8)"></div>
    </div>

    <script>
        let turn = 'X';
        const cells = document.getElementsByClassName('cell');

        function clickCell(index) {
            if (!cells[index].innerText) {
                cells[index].innerText = turn;
                if (checkWinner()) {
                    setTimeout(() => alert("Người thắng cuộc là: " + turn), 10);
                } else {
                    turn = turn === 'X' ? 'O' : 'X';
                }
            }
        }

        function checkWinner() {
            const lines = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // Hàng ngang
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // Hàng dọc
                [0, 4, 8], [2, 4, 6]             // Đường chéo
            ];
            for (let line of lines) {
                const [a, b, c] = line;
                if (cells[a].innerText && cells[a].innerText === cells[b].innerText && cells[a].innerText === cells[c].innerText) {
                    return true;
                }
            }
            return false;
        }
    </script>
</body>
</html>
