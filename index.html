<!DOCTYPE html>
<html>
<head>
    <title>Game Caro Siêu Tốc</title>
    <style>
        body { text-align: center; font-family: sans-serif; background: #2c3e50; color: white; }
        .board { display: grid; grid-template-columns: repeat(3, 100px); gap: 10px; justify-content: center; margin-top: 20px; }
        .cell { width: 100px; height: 100px; background: #34495e; font-size: 50px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .cell:hover { background: #2c3e50; }
    </style>
</head>
<body>
    <h1>Game Caro</h1>
    <div class="board" id="board">
        <div class="cell" onclick="clickCell(0)"></div>
        <div class="cell" onclick="clickCell(1)"></div>
        <div class="cell" onclick="clickCell(2)"></div>
        <div class="cell" onclick="clickCell(3)"></div>
        <div class="cell" onclick="clickCell(4)"></div>
        <div class="cell" onclick="clickCell(5)"></div>
        <div class="cell" onclick="clickCell(6)"></div>
        <div class="cell" onclick="clickCell(7)"></div>
        <div class="cell" onclick="clickCell(8)"></div>
    </div>
    <script>
        let turn = 'X';
        function clickCell(index) {
            let cell = document.getElementsByClassName('cell')[index];
            if (!cell.innerText) {
                cell.innerText = turn;
                turn = turn === 'X' ? 'O' : 'X';
            }
        }
    </script>
</body>
</html>
